<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Voltaire Research is building intelligence for music." />
    <meta name="theme-color" content="#062632" />
    <meta property="og:title" content="Voltaire Research" />
    <meta property="og:description" content="Building intelligence for music." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/voltaire-wordmark.png" />
    <title>Voltaire Research — Intelligence for music</title>
    <link rel="icon" href="assets/voltaire-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="shell nav" aria-label="Primary navigation">
        <a class="brand" href="./" aria-label="Voltaire Research home">
          <img src="assets/voltaire-mark.png" alt="" />
          <span>Voltaire Research</span>
        </a>
        <div class="nav-links">
          <a class="journal-link" href="research/">Research</a>
          <a class="journal-link" href="blog/">Blog</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="shell hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow"><span class="signal" aria-hidden="true"></span> Voltaire Research</p>
          <h1 id="hero-title">Intelligence<br /><em>for music.</em></h1>
        </div>

        <div class="waitlist-panel" id="waitlist">
          <h2>Join our waitlist.</h2>
          <p class="panel-copy">Be first to hear what we are building.</p>
          <form class="waitlist-form" data-waitlist novalidate>
            <label for="email">Email address</label>
            <div class="form-row">
              <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@domain.com" required />
              <button type="submit">Join waitlist <span aria-hidden="true">→</span></button>
            </div>
            <p class="form-note">Occasional updates. No noise.</p>
            <p class="form-status" data-form-status role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <div class="shell footer-grid">
        <img class="wordmark" src="assets/voltaire-wordmark.png" alt="Voltaire Research" />
        <div class="footer-meta">
          <p class="footer-statement">Intelligence<br />for music.</p>
          <p>© 2026 Voltaire Research</p>
        </div>
      </div>
    </footer>
    <script src="site.js"></script>
  </body>
</html>
