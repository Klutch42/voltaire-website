<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Voltaire Research is building intelligence for music." />
    <meta name="theme-color" content="#062632" />
    <meta property="og:title" content="Voltaire Research" />
    <meta property="og:description" content="Building intelligence for music." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/voltaire-wordmark.png" />
    <title>Voltaire Research — Intelligence for music</title>
    <link rel="icon" href="assets/voltaire-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="shell nav" aria-label="Primary navigation">
        <a class="brand" href="./" aria-label="Voltaire Research home">
          <img src="assets/voltaire-mark.png" alt="" />
          <span>Voltaire Research</span>
        </a>
        <div class="nav-links">
          <a class="journal-link" href="research/">Research</a>
          <a class="journal-link" href="blog/">Blog</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="shell hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <h1 id="hero-title">Intelligence<br /><em>for music.</em></h1>
        </div>

        <section class="overture-intro" aria-labelledby="overture-title">
          <h2 id="overture-title">Introducing<br /><em>Voltaire Overture.</em></h2>
          <p>Add intelligence to your music discovery.</p>
          <div class="overture-actions">
            <button class="overture-action primary" type="button" data-waitlist-cta>Join waitlist</button>
            <button class="overture-action secondary" type="button" data-waitlist-cta>Request early access</button>
          </div>
        </section>

        <div class="waitlist-panel" id="waitlist" hidden>
          <h2>Join our waitlist.</h2>
          <button class="waitlist-trigger" type="button" data-open-waitlist aria-expanded="false" aria-controls="waitlist-form">
            Join waitlist <span aria-hidden="true">→</span>
          </button>

          <form class="waitlist-form" id="waitlist-form" data-waitlist novalidate hidden>
            <div class="name-fields">
              <div class="field">
                <label for="first-name">First name</label>
                <input id="first-name" name="firstName" type="text" autocomplete="given-name" required />
              </div>
              <div class="field">
                <label for="last-name">Last name</label>
                <input id="last-name" name="lastName" type="text" autocomplete="family-name" required />
              </div>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required />
            </div>
            <fieldset class="role-field">
              <legend>I am a</legend>
              <div class="role-options">
                <label><input type="radio" name="role" value="student" required /><span>Student</span></label>
                <label><input type="radio" name="role" value="researcher" /><span>Researcher</span></label>
                <label><input type="radio" name="role" value="user" /><span>User</span></label>
              </div>
            </fieldset>
            <button class="submit-waitlist" type="submit">Submit <span aria-hidden="true">→</span></button>
            <p class="form-status" data-form-status role="status" aria-live="polite"></p>
          </form>

          <div class="waitlist-success" data-waitlist-success hidden>
            <p>Thank you.</p>
          </div>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <div class="shell footer-grid">
        <div class="footer-meta">
          <p class="footer-statement">Intelligence<br />for music.</p>
          <p>© 2026 Voltaire Research</p>
        </div>
      </div>
    </footer>
    <script src="site.js"></script>
  </body>
</html>
